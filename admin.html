<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fraeymark Time Zones Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    input, textarea, button {
      font-size: 16px;
      padding: 8px;
      margin-top: 5px;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      margin-right: 8px;
    }

    .timezone {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
    }

    .timezone h3 {
      margin-top: 0;
    }

    .members {
      white-space: pre-line;
      margin: 10px 0;
    }

    #adminArea {
      display: none;
    }
  </style>
</head>

<body>

  <div id="loginArea">
    <h1>Fraeymark Time Zones Admin</h1>

    <label>Email:</label>
    <input type="email" id="email">

    <br><br>

    <label>Password:</label>
    <input type="password" id="password">

    <br><br>

    <button id="loginButton">Log In</button>

    <p id="loginMessage"></p>
  </div>

  <div id="adminArea">
    <h1>Fraeymark Time Zones Admin</h1>

    <button id="logoutButton">Log Out</button>

    <hr>

    <h2>Add Time Zone</h2>

    <label>Time Zone:</label>
    <input type="text" id="timezone" placeholder="America/New_York">

    <br><br>

    <label>Members (one per line):</label>
    <textarea id="members"></textarea>

    <br>

    <button id="addButton">Add Time Zone</button>

    <p id="message"></p>

    <hr>

    <h2>Existing Time Zones</h2>

    <div id="timezoneList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = "https://motmsqjdghsqwwgjekad.supabase.co";
    const supabaseKey = "sb_publishable_Ry6z3_4Pt9p3fKy7aK27hg_CFE1U_u9";

    const client = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    document.getElementById("loginButton").addEventListener("click", login);
    document.getElementById("logoutButton").addEventListener("click", logout);
    document.getElementById("addButton").addEventListener("click", addTimeZone);

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("loginMessage");

      const { error } = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      document.getElementById("loginArea").style.display = "none";
      document.getElementById("adminArea").style.display = "block";

      loadTimeZones();
    }

    async function logout() {
      await client.auth.signOut();

      document.getElementById("adminArea").style.display = "none";
      document.getElementById("loginArea").style.display = "block";
    }

    async function addTimeZone() {
      const timezone = document.getElementById("timezone").value.trim();
      const members = document.getElementById("members").value.trim();
      const message = document.getElementById("message");

      if (!timezone) {
        message.textContent = "Please enter a time zone.";
        return;
      }

      const { error } = await client
        .from("time_zones")
        .insert({
          timezone: timezone,
          members: members
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      document.getElementById("timezone").value = "";
      document.getElementById("members").value = "";

      message.textContent = "Time zone added.";

      loadTimeZones();
    }

    async function loadTimeZones() {
      const list = document.getElementById("timezoneList");

      const { data, error } = await client
        .from("time_zones")
        .select("*")
        .order("id");

      if (error) {
        list.textContent = error.message;
        return;
      }

      list.innerHTML = "";

      data.forEach(zone => {
        const div = document.createElement("div");
        div.className = "timezone";

        div.innerHTML = `
          <h3>${escapeHtml(zone.timezone)}</h3>

          <div class="members">${escapeHtml(zone.members || "")}</div>

          <button onclick="editTimeZone(${zone.id})">Edit</button>
          <button onclick="deleteTimeZone(${zone.id})">Delete</button>
        `;

        list.appendChild(div);
      });
    }

    async function editTimeZone(id) {
      const { data, error } = await client
        .from("time_zones")
        .select("*")
        .eq("id", id)
        .single();

      if (error) {
        alert(error.message);
        return;
      }

      const newMembers = prompt(
        "Enter members, one per line:",
        data.members || ""
      );

      if (newMembers === null) {
        return;
      }

      const { error: updateError } = await client
        .from("time_zones")
        .update({
          members: newMembers
        })
        .eq("id", id);

      if (updateError) {
        alert(updateError.message);
        return;
      }

      loadTimeZones();
    }

    async function deleteTimeZone(id) {
      if (!confirm("Delete this time zone?")) {
        return;
      }

      const { error } = await client
        .from("time_zones")
        .delete()
        .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      loadTimeZones();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
