<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fraeymark Time Zones Admin</title>
</head>
<body>
  <h1>Fraeymark Time Zones Admin</h1>

  <div id="login">
    <h2>Admin Login</h2>

    <label>Email:</label><br>
    <input type="email" id="email"><br><br>

    <label>Password:</label><br>
    <input type="password" id="password"><br><br>

    <button id="loginButton">Log In</button>

    <p id="loginMessage"></p>
  </div>

  <div id="admin" style="display:none;">
    <h2>Time Zones</h2>

    <button id="logoutButton">Log Out</button>

    <hr>

    <label>Time Zone:</label><br>
    <input type="text" id="timezone" placeholder="America/New_York" style="width:300px;"><br><br>

    <label>Members (one per line):</label><br>
    <textarea id="members" rows="8" cols="40"></textarea><br><br>

    <button id="addButton">Add Time Zone</button>

    <p id="message"></p>

    <hr>

    <div id="timeZoneList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
   const supabaseUrl = "YOUR-SUPABASE-URL";
const supabaseKey = "YOUR-PUBLISHABLE-KEY";

    if (!supabaseUrl || !supabaseKey) {
      document.getElementById("loginMessage").textContent =
        "Supabase settings are missing.";
    }

    const client = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    document.getElementById("loginButton").addEventListener("click", login);
    document.getElementById("logoutButton").addEventListener("click", logout);
    document.getElementById("addButton").addEventListener("click", addTimeZone);

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      document.getElementById("loginMessage").textContent = "Logging in...";

      const { error } = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        document.getElementById("loginMessage").textContent = error.message;
        return;
      }

      document.getElementById("login").style.display = "none";
      document.getElementById("admin").style.display = "block";

      document.getElementById("loginMessage").textContent = "";

      loadTimeZones();
    }

    async function logout() {
      await client.auth.signOut();

      document.getElementById("admin").style.display = "none";
      document.getElementById("login").style.display = "block";
    }

    async function loadTimeZones() {
      const { data, error } = await client
        .from("time_zones")
        .select("*")
        .order("id");

      if (error) {
        document.getElementById("message").textContent = error.message;
        return;
      }

      const list = document.getElementById("timeZoneList");
      list.innerHTML = "";

      data.forEach(zone => {
        const div = document.createElement("div");

        const heading = document.createElement("h3");
        heading.textContent = zone.timezone;

        const members = document.createElement("pre");
        members.textContent = zone.members || "";

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteTimeZone(zone.id));

        div.appendChild(heading);
        div.appendChild(members);
        div.appendChild(deleteButton);
        div.appendChild(document.createElement("hr"));

        list.appendChild(div);
      });
    }

    async function addTimeZone() {
      const timezone = document.getElementById("timezone").value.trim();
      const members = document.getElementById("members").value.trim();

      if (!timezone) {
        document.getElementById("message").textContent =
          "Please enter a time zone.";
        return;
      }

      const { error } = await client
        .from("time_zones")
        .insert({
          timezone: timezone,
          members: members
        });

      if (error) {
        document.getElementById("message").textContent = error.message;
        return;
      }

      document.getElementById("timezone").value = "";
      document.getElementById("members").value = "";
      document.getElementById("message").textContent = "Added.";

      loadTimeZones();
    }

    async function deleteTimeZone(id) {
      if (!confirm("Delete this time zone?")) {
        return;
      }

      const { error } = await client
        .from("time_zones")
        .delete()
        .eq("id", id);

      if (error) {
        document.getElementById("message").textContent = error.message;
        return;
      }

      loadTimeZones();
    }
  </script>
</body>
</html>
