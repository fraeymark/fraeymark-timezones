
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fraeymark Time Zones Admin</title>
</head>
<body>
  <h1>Fraeymark Time Zones Admin</h1>

  <div id="login">
    <h2>Admin Login</h2>

    <label>Email:</label><br>
    <input type="email" id="email"><br><br>

    <label>Password:</label><br>
    <input type="password" id="password"><br><br>

    <button onclick="login()">Log In</button>

    <p id="loginMessage"></p>
  </div>

  <div id="admin" style="display:none;">
    <h2>Time Zones</h2>

    <button onclick="logout()">Log Out</button>

    <hr>

    <label>Time Zone:</label><br>
    <input type="text" id="timezone" placeholder="America/New_York" style="width:300px;"><br><br>

    <label>Members (one per line):</label><br>
    <textarea id="members" rows="8" cols="40"></textarea><br><br>

    <button onclick="addTimeZone()">Add Time Zone</button>

    <p id="message"></p>

    <hr>

    <div id="timeZoneList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = localStorage.getItem("supabaseUrl");
    const supabaseKey = localStorage.getItem("supabaseKey");

    if (!supabaseUrl || !supabaseKey) {
      document.getElementById("loginMessage").textContent =
        "Supabase settings are missing. Please enter them first.";
    }

    const supabase = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById("loginMessage").textContent = error.message;
        return;
      }

      document.getElementById("login").style.display = "none";
      document.getElementById("admin").style.display = "block";

      loadTimeZones();
    }

    async function logout() {
      await supabase.auth.signOut();

      document.getElementById("admin").style.display = "none";
      document.getElementById("login").style.display = "block";
    }
